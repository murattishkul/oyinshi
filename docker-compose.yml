version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: oyinshi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oyinshi}
      POSTGRES_USER: ${POSTGRES_USER:-oyinshi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oyinshi_user} -d ${POSTGRES_DB:-oyinshi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Telegram бот
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oyinshi_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-oyinshi_user}:${POSTGRES_PASSWORD:-your_secure_password}@postgres:5432/${POSTGRES_DB:-oyinshi}?schema=public
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    command: sh -c "sleep 10 && npx prisma db push && npm start"

  # Nginx (опционально, для SSL и проксирования)
#  nginx:
#    image: nginx:alpine
#    container_name: oyinshi_nginx
#    restart: unless-stopped
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#      - ./nginx/ssl:/etc/nginx/ssl:ro
#      - ./nginx/logs:/var/log/nginx
#    depends_on:
#      - app
    # Раскомментируйте если нужен Nginx
    # profiles:
    #   - production

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: oyinshi_network
